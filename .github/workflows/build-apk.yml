name: Build Kenisha APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show uploaded files
        run: ls -lah

      - name: Extract project code
        run: |
          mkdir -p project
          unzip -q kenisha-code.zip -d project

      - name: Reassemble media
        run: |
          cat kenisha-media-01.zip.part kenisha-media-02.zip.part > media.zip
          mkdir -p media
          unzip -q media.zip -d media

      - name: Copy media
        run: |
          mkdir -p project/app/src/main/assets
          cp -R media/* project/app/src/main/assets/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kenisha-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
